<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 가계부</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      margin: 0 auto; padding: 16px; max-width: 640px;
      background: #f4f6f8; color: #1f2933;
    }
    h1 { font-size: 22px; margin: 8px 0 16px; }

    .summary { display: flex; gap: 10px; margin-bottom: 16px; }
    .card { flex: 1; background: #fff; border-radius: 12px; padding: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
    .card .label { font-size: 12px; color: #7b8794; }
    .card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .income { color: #2f855a; } .expense { color: #c53030; } .balance { color: #2b6cb0; }

    form { background: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .row > * { flex: 1; }
    label { display: block; font-size: 12px; color: #7b8794; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #d3dae0;
      border-radius: 8px; font-size: 14px; background: #fff; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px;
      background: #2b6cb0; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }

    .list { background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .item { display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid #eef1f4; }
    .item:last-child { border-bottom: none; }
    .info { flex: 1; min-width: 0; }
    .memo { font-weight: 600; }
    .meta { font-size: 12px; color: #7b8794; margin-top: 2px; }
    .amt { font-weight: 700; white-space: nowrap; }
    .del { background: none; border: none; color: #c53030; font-size: 18px;
      cursor: pointer; width: auto; padding: 0 4px; }
    .empty, .loading { text-align: center; color: #7b8794; padding: 24px; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-right: 6px; }
    .tag-income { background: #e6fffa; color: #2f855a; }
    .tag-expense { background: #fff5f5; color: #c53030; }
  </style>
</head>
<body>
  <h1>💰 나의 가계부</h1>

  <div class="summary">
    <div class="card"><div class="label">수입</div><div class="value income" id="sumIncome">-</div></div>
    <div class="card"><div class="label">지출</div><div class="value expense" id="sumExpense">-</div></div>
    <div class="card"><div class="label">잔액</div><div class="value balance" id="sumBalance">-</div></div>
  </div>

  <form id="entryForm">
    <div class="row">
      <div><label>날짜</label><input type="date" id="date" required></div>
      <div><label>구분</label>
        <select id="type"><option value="지출">지출</option><option value="수입">수입</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>분류</label><input type="text" id="category" placeholder="식비, 교통, 월급..." required></div>
      <div><label>금액</label><input type="number" id="amount" placeholder="10000" min="0" required></div>
    </div>
    <div class="row">
      <div><label>내용</label><input type="text" id="memo" placeholder="점심 도시락" required></div>
    </div>
    <button type="submit" id="submitBtn">추가하기</button>
  </form>

  <div class="list" id="list"><div class="loading">불러오는 중…</div></div>

  <script>
    // ▼▼▼ 여기에 배포한 앱스크립트 웹앱 URL을 붙여넣으세요 (…/exec 로 끝나는 주소) ▼▼▼
    const API_URL = 'https://script.google.com/macros/s/AKfycbwZeblT5dU6NI1gcim6gL-0Na3RaNuQMivmVJq0LfOXAAi6djQgPLwiY4ZC1x_hSJE-/exec';
    // ▲▲▲

    document.getElementById('date').valueAsDate = new Date();
    const won = n => Number(n).toLocaleString('ko-KR') + '원';
    const escapeHtml = s => String(s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function render(records) {
      const list = document.getElementById('list');
      let income = 0, expense = 0;

      if (!records.length) {
        list.innerHTML = '<div class="empty">아직 내역이 없어요. 첫 내역을 추가해 보세요!</div>';
      } else {
        list.innerHTML = records.map(r => {
          if (r.type === '수입') income += r.amount; else expense += r.amount;
          const sign = r.type === '수입' ? '+' : '-';
          const cls  = r.type === '수입' ? 'income' : 'expense';
          const tag  = r.type === '수입' ? 'tag-income' : 'tag-expense';
          return `<div class="item">
              <div class="info">
                <div class="memo">${escapeHtml(r.memo)}</div>
                <div class="meta"><span class="tag ${tag}">${escapeHtml(r.category)}</span>${escapeHtml(r.date)}</div>
              </div>
              <div class="amt ${cls}">${sign}${won(r.amount)}</div>
              <button class="del" data-id="${escapeHtml(r.id)}" title="삭제">🗑️</button>
            </div>`;
        }).join('');
      }
      document.getElementById('sumIncome').textContent  = won(income);
      document.getElementById('sumExpense').textContent = won(expense);
      document.getElementById('sumBalance').textContent = won(income - expense);
    }

    // 조회 (GET)
    async function load() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.ok) render(data.records);
      } catch (err) {
        document.getElementById('list').innerHTML =
          '<div class="empty">불러오기 실패 😢 API_URL을 확인하세요.</div>';
      }
    }

    // 추가/삭제 (POST) — CORS 프리플라이트를 피하려고 text/plain 으로 보냄
    async function post(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '저장 중…';

      const record = {
        date: document.getElementById('date').value,
        type: document.getElementById('type').value,
        category: document.getElementById('category').value,
        memo: document.getElementById('memo').value,
        amount: document.getElementById('amount').value
      };

      try {
        const data = await post({ action: 'add', record });
        if (data.ok) {
          render(data.records);
          document.getElementById('category').value = '';
          document.getElementById('memo').value = '';
          document.getElementById('amount').value = '';
        }
      } catch (err) { alert('저장 실패: ' + err); }
      btn.disabled = false; btn.textContent = '추가하기';
    });

    // 삭제 버튼 (이벤트 위임)
    document.getElementById('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      if (!confirm('이 내역을 삭제할까요?')) return;
      const data = await post({ action: 'delete', id: btn.dataset.id });
      if (data.ok) render(data.records);
    });

    load();
  </script>
</body>
</html>
